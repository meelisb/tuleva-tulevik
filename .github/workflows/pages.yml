# Avaldab GitHub Pages'i ainult harust main: https://meelisb.github.io/tuleva-tulevik/
# Prototüübid on main-is kaustades kalkulaator/, printsiibid/ ja elukaar/. Teisi harusid ei avaldata,
# et elus oleks alati ainult kõige uuem versioon. Keskkonna „github-pages“ reegel lubab avaldada ainult main-ist.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pane leht kokku
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/tests _site/node_modules
          touch _site/.nojekyll
          find _site -maxdepth 2 -name index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
